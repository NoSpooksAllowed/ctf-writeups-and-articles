<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CTF Writeups &amp; Articles</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="description" content="Penetration testing writeups and security articles">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'CTF Writeups & Articles',
      repo: 'NoSpooksAllowed/ctf-writeups-and-articles',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      maxLevel: 4,
      plugins: [
        function (hook, vm) {
          hook.beforeEach(function (content) {
            return content.replace(
              /!\[\[Articles\/JWT Articles\/Article \d+\/([^\]]+?)\]\]/g,
              '![]($1)'
            );
          });
        }
      ]
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
</body>
</html>
