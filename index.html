<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CTF Writeups &amp; Articles</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="description" content="Penetration testing writeups and security articles">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'CTF Writeups & Articles',
      repo: 'NoSpooksAllowed/ctf-writeups-and-articles',
      loadSidebar: true,
      subMaxLevel: 3,
      maxLevel: 4,
      sidebarDisplayLevel: 3,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md',
        '/.*/_sidebar': '/_sidebar',
        // fallback for stale relative links resolved against repo root (pre-fix cached pages)
        '/Article%201': 'Articles/LFI%20Articles/Article%201.md',
        '/Article%201/': 'Articles/JWT%20Articles/Article%201/',
        '/Article%202': 'Articles/JWT%20Articles/Article%202/Article%202%20-%20Brute-Forcing%20Weak%20JWT%20Secrets.md',
        '/Article%203': 'Articles/JWT%20Articles/Article%203/Article%203%20-%20Injecting%20Self-Signed%20JWTs%20via%20Header%20Parameters.md',
        '/Article%204': 'Articles/JWT%20Articles/Article%204/Article%204%20-%20Algorithm%20Confusion%20Attacks.md'
      },
      auto2top: true,
      plugins: [
        function (hook, vm) {
          hook.beforeEach(function (content) {
            var path = location.pathname.replace(/\/index\.html$/, '');
            if (path.slice(-1) !== '/') path += '/';
            var base = location.protocol + '//' + location.host + path;
            return content.replace(
              /!\[\[([^\]]+?)\]\]/g,
              function (match, p) {
                var encoded = p.split('/').map(encodeURIComponent).join('/');
                return '![](' + base + encoded + ')';
              }
            );
          });
        }
      ]
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse@1.1.0/dist/docsify-sidebar-collapse.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse@1.1.0/dist/sidebar.min.css" />
</body>
</html>
